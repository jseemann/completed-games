<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Completed Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --line: #e6e2d9;
    --text: #1d1c1a;
    --muted: #75716a;
    --beaten: #1f7a52;
    --beaten-bg: #e3f2ea;
    --open: #8a6d1d;
    --open-bg: #f6efd9;
    --endless: #5a6170;
    --endless-bg: #eceef2;
    --gold: #a77a12;
    --radius: 12px;
    --p-PlayStation: #2a78d6;
    --p-Steam: #eb6834;
    --p-Apple: #1baf7a;
    --p-Nintendo: #eda100;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 56px 24px 80px; }

  header h1 {
    font-family: Fraunces, Georgia, serif; font-weight: 600;
    font-size: clamp(34px, 5vw, 50px); line-height: 1.05; margin: 0 0 8px; letter-spacing: -0.01em;
  }
  header p { color: var(--muted); margin: 0; }

  /* cover wall */
  .shelf { display: flex; flex-wrap: wrap; padding: 26px 6px 6px; margin: 0 -6px; }
  .tile {
    width: 62px; height: 62px; margin: 0 -5px -8px 0; border-radius: 9px; overflow: hidden;
    background: #ddd8cc; box-shadow: 0 1px 0 rgba(29,28,26,.08), 0 6px 14px -6px rgba(29,28,26,.35);
    border: 2px solid #fff; transform: rotate(var(--r)); position: relative;
    animation: drop .5s cubic-bezier(.2,.8,.3,1.2) both; animation-delay: var(--d);
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile:hover { transform: rotate(0deg) scale(1.35); z-index: 2; transition: transform .15s ease; }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px) rotate(calc(var(--r) * 3)); } }
  @media (prefers-reduced-motion: reduce) { .tile { animation: none; } .tile:hover { transition: none; } }

  .summary { display: grid; grid-template-columns: auto 1fr; gap: 36px; align-items: end;
    margin: 32px 0 32px; padding: 20px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stats { display: grid; grid-template-columns: repeat(3, auto); gap: 14px 28px; }
  .stat b { display: block; font: 600 26px Fraunces, Georgia, serif; }
  .stat span { color: var(--muted); font-size: 13px; }
  .stat i, .sys i, .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  /* per-year chart */
  .chart h2 { font: 600 13px Inter, sans-serif; color: var(--muted); margin: 0 0 8px; }
  .chart svg { display: block; width: 100%; height: 132px; overflow: visible; }
  .chart .bar { cursor: pointer; }
  .chart .bar:focus { outline: none; }
  .chart .bar:focus-visible rect.hit { stroke: var(--text); stroke-width: 1.5; }
  .chart .axis { font: 11px Inter, sans-serif; fill: var(--muted); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 18px -8px rgba(29,28,26,.35); display: none; z-index: 10; }
  .tip b { font: 600 15px Fraunces, Georgia, serif; display: block; margin-bottom: 2px; }
  .tip div { color: var(--muted); }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
  .group { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .group button {
    border: 0; background: none; color: var(--muted); font: 500 13px Inter, sans-serif;
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .group button.on { background: var(--text); color: #fff; }
  .group button .n { opacity: .6; margin-left: 4px; }
  input[type=search], select {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 9px 16px; font: 14px Inter, sans-serif;
  }
  input[type=search] { flex: 1; min-width: 180px; }

  .year { display: flex; align-items: baseline; gap: 10px; margin: 36px 0 10px; scroll-margin-top: 16px; }
  .year .yr { font: 600 30px/1 Fraunces, Georgia, serif; letter-spacing: -0.01em; }
  .year .cnt { color: var(--muted); font-size: 13px; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .row {
    display: grid; grid-template-columns: 104px 1fr auto; gap: 16px; align-items: center;
    padding: 12px 16px; border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .row:hover { background: #fbfaf7; }

  .thumb {
    width: 104px; height: 58px; border-radius: 8px; overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb img.bg { filter: blur(10px) brightness(.85) saturate(1.2); transform: scale(1.4); }
  .thumb img.fg { inset: 4px auto 4px 50%; transform: translateX(-50%); width: auto; height: calc(100% - 8px); aspect-ratio: 1; border-radius: 4px; }
  .thumb .mono { font: 600 20px Fraunces, Georgia, serif; color: rgba(255,255,255,.95); }

  .info { min-width: 0; }
  .title { font-weight: 600; line-height: 1.3; }
  .title .sys { font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 6px; }
  .proof { color: var(--muted); font-size: 13.5px; }
  .note { color: var(--muted); font-size: 13px; font-style: italic; }

  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; white-space: nowrap; }
  .pill { font: 600 11.5px Inter, sans-serif; padding: 3px 9px; border-radius: 999px; }
  .pill.beaten { color: var(--beaten); background: var(--beaten-bg); }
  .pill.unfinished, .pill.unknown { color: var(--open); background: var(--open-bg); }
  .pill.endless { color: var(--endless); background: var(--endless-bg); }
  .pill.plat { color: var(--gold); background: #f8edcf; }
  .date { color: var(--muted); font-size: 12.5px; }
  .pills { display: flex; gap: 6px; }

  .empty { color: var(--muted); padding: 60px 0; text-align: center; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }

  @media (max-width: 760px) {
    .summary { grid-template-columns: 1fr; gap: 20px; }
  }
  @media (max-width: 600px) {
    .tile { width: 46px; height: 46px; }
    .tile:nth-child(n+22) { display: none; }
    .stats { grid-template-columns: repeat(2, auto); }
    .group { flex-wrap: wrap; border-radius: 18px; }
    .group button { white-space: nowrap; }
    .row { grid-template-columns: 72px 1fr; }
    .thumb { width: 72px; height: 44px; }
    .side { grid-column: 2; flex-direction: row; align-items: center; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Completed Games</h1>
    <p id="sub">Loading…</p>
  </header>

  <div class="shelf" id="shelf" aria-hidden="true"></div>

  <section class="summary">
    <div class="stats" id="stats"></div>
    <figure class="chart" id="chart" style="margin:0">
      <h2>Finished per year</h2>
      <svg id="chartSvg" role="img" aria-label="Games beaten per year, by platform"></svg>
      <div class="legend" id="legend"></div>
    </figure>
  </section>
  <div class="tip" id="tip" role="tooltip"></div>

  <section class="controls">
    <div class="group" id="platforms"></div>
    <div class="group" id="statuses"></div>
    <input type="search" id="q" placeholder="Search games">
    <select id="sort">
      <option value="recent">Most recent</option>
      <option value="az">A to Z</option>
    </select>
  </section>

  <main id="out"></main>
  <footer id="foot"></footer>
</div>

<script>
const STATUS = { beaten: "Beaten", unfinished: "Unfinished", unknown: "No proof", endless: "No ending" };
const state = { platform: "All", status: "beaten", q: "", sort: "recent" };
let data;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
function initials(t) {
  const w = t.replace(/['’]/g, "").replace(/[^A-Za-z0-9 ]/g, " ").split(/\s+/)
    .filter(x => x && !/^(the|of|a|an|and|in|to)$/i.test(x));
  return ((w[0]?.[0] || "") + (w[1]?.[0] || "")).toUpperCase();
}
function fmt(d) {
  if (!d) return "";
  const [y, m] = d.split("-");
  if (!m) return y;
  return new Date(y, m - 1).toLocaleString("en", { month: "short", year: "numeric" });
}
const counts = (list, key) => list.reduce((o, g) => (o[g[key]] = (o[g[key]] || 0) + 1, o), {});

function renderControls() {
  const plats = ["All", ...new Set(data.games.map(g => g.platform))];
  const pc = counts(data.games.filter(g => state.status === "all" || g.status === state.status), "platform");
  document.getElementById("platforms").innerHTML = plats.map(p =>
    `<button data-p="${p}" class="${p === state.platform ? "on" : ""}">${p}${p !== "All" ? `<span class="n">${pc[p] || 0}</span>` : ""}</button>`).join("");
  const sc = counts(data.games.filter(g => state.platform === "All" || g.platform === state.platform), "status");
  const used = Object.keys(STATUS).filter(s => data.games.some(g => g.status === s));
  document.getElementById("statuses").innerHTML = [...used, "all"].map(s =>
    `<button data-s="${s}" class="${s === state.status ? "on" : ""}">${STATUS[s] || "All"}${s !== "all" ? `<span class="n">${sc[s] || 0}</span>` : ""}</button>`).join("");
}

function renderStats() {
  const beaten = data.games.filter(g => g.status === "beaten");
  const year = new Date().getFullYear().toString();
  const tiles = [
    [beaten.length, "games beaten"],
    ...PLATS.filter(p => beaten.some(g => g.platform === p)).map(p => [beaten.filter(g => g.platform === p).length, `<i style="background:var(--p-${p})"></i>on ${p}`]),
    [beaten.filter(g => g.platinum).length, "platinums"],
    [beaten.filter(g => g.lastPlayed?.startsWith(year)).length, `finished in ${year}`],
  ];
  document.getElementById("stats").innerHTML = tiles.map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
}

const PLATS = ["PlayStation", "Steam", "Apple", "Nintendo"];

function renderShelf() {
  const picks = data.games.filter(g => g.status === "beaten" && g.cover)
    .sort((a, b) => (b.lastPlayed || "").localeCompare(a.lastPlayed || "")).slice(0, 32);
  document.getElementById("shelf").innerHTML = picks.map((g, i) => {
    const r = ((hue(g.title) % 9) - 4) * 0.9;
    return `<div class="tile" title="${esc(g.title)}" style="--r:${r}deg;--d:${i * 25}ms"><img src="${esc(g.cover)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></div>`;
  }).join("");
}

function renderChart() {
  const beaten = data.games.filter(g => g.status === "beaten" && /^\d{4}/.test(g.lastPlayed || ""));
  const yrs = beaten.map(g => +g.lastPlayed.slice(0, 4));
  const lo = Math.min(...yrs), hi = Math.max(...yrs);
  const years = []; for (let y = lo; y <= hi; y++) years.push(y);
  const by = Object.fromEntries(years.map(y => [y, Object.fromEntries(PLATS.map(p => [p, 0]))]));
  beaten.forEach(g => by[+g.lastPlayed.slice(0, 4)][g.platform]++);
  const totals = years.map(y => PLATS.reduce((a, p) => a + by[y][p], 0));
  const max = Math.max(...totals);
  const svg = document.getElementById("chartSvg");
  const W = svg.clientWidth || 560, H = 132, base = H - 18, top = 8;
  const slot = W / years.length, bw = Math.max(4, Math.min(22, slot - 4));
  const scale = v => v / max * (base - top);
  let out = `<line x1="0" x2="${W}" y1="${base + 0.5}" y2="${base + 0.5}" stroke="var(--line)"/>`;
  years.forEach((y, i) => {
    const x = i * slot + (slot - bw) / 2;
    let yy = base, segs = "";
    const stack = PLATS.filter(p => by[y][p]);
    stack.forEach((p, k) => {
      const h = scale(by[y][p]); const last = k === stack.length - 1;
      const gap = k ? 2 : 0;
      yy -= h;
      const r = last ? 4 : 0;
      segs += last
        ? `<path d="M${x},${yy + h - gap} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${yy + h - gap} Z" fill="var(--p-${p})"/>`
        : `<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(0, h - gap)}" fill="var(--p-${p})"/>`;
    });
    const showLabel = years.length <= 12 || y % 2 === hi % 2;
    out += `<g class="bar" data-y="${y}" tabindex="${totals[i] ? 0 : -1}" role="button" aria-label="${y}: ${totals[i]} games beaten">
      <rect class="hit" x="${i * slot}" y="${top}" width="${slot}" height="${base - top}" fill="transparent" rx="4"/>${segs}
      ${showLabel ? `<text class="axis" x="${i * slot + slot / 2}" y="${H - 3}" text-anchor="middle">${String(y).slice(2) === String(y).slice(2) && years.length > 12 ? "'" + String(y).slice(2) : y}</text>` : ""}</g>`;
  });
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = out;
  document.getElementById("legend").innerHTML = PLATS.filter(p => beaten.some(g => g.platform === p))
    .map(p => `<span><i style="background:var(--p-${p})"></i>${p}</span>`).join("");

  const tip = document.getElementById("tip");
  const show = (g, ev) => {
    const y = +g.dataset.y, t = PLATS.reduce((a, p) => a + by[y][p], 0);
    tip.innerHTML = `<b>${y}</b>${t} beaten` + PLATS.filter(p => by[y][p]).map(p => `<div><i style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--p-${p})"></i>${p}: ${by[y][p]}</div>`).join("");
    tip.style.display = "block";
    const r = g.getBoundingClientRect();
    const px = ev && ev.clientX ? ev.clientX : r.left + r.width / 2;
    tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, px + 12) + "px";
    tip.style.top = (r.top - tip.offsetHeight - 6 < 0 ? r.bottom + 6 : r.top - tip.offsetHeight + 20) + "px";
  };
  const hide = () => tip.style.display = "none";
  svg.querySelectorAll(".bar").forEach(g => {
    g.addEventListener("mousemove", e => show(g, e));
    g.addEventListener("mouseleave", hide);
    g.addEventListener("focus", () => show(g));
    g.addEventListener("blur", hide);
    const go = () => {
      Object.assign(state, { platform: "All", status: "beaten", q: "", sort: "recent" });
      document.getElementById("q").value = ""; document.getElementById("sort").value = "recent";
      render(); hide();
      document.getElementById("y-" + g.dataset.y)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    };
    g.addEventListener("click", go);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}

function thumb(g) {
  const h = hue(g.title);
  const bg = `linear-gradient(135deg, hsl(${h} 45% 55%), hsl(${(h + 50) % 360} 50% 38%))`;
  let img = "";
  if (g.cover && g.coverFit === "square")
    img = `<img class="bg" src="${esc(g.cover)}" alt="" loading="lazy" onerror="this.remove()"><img class="fg" src="${esc(g.cover)}" alt="" loading="lazy" onerror="this.remove()">`;
  else if (g.cover)
    img = `<img src="${esc(g.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`;
  return `<div class="thumb" style="background:${bg}"><span class="mono">${esc(initials(g.title))}</span>${img}</div>`;
}

function row(g) {
  return `<div class="row">
    ${thumb(g)}
    <div class="info">
      <div class="title">${esc(g.title)}<span class="sys"><i style="background:var(--p-${g.platform})"></i>${esc(g.system)}</span></div>
      ${g.proof ? `<div class="proof">${esc(g.proof)}</div>` : ""}
      ${g.note ? `<div class="note">${esc(g.note)}</div>` : ""}
    </div>
    <div class="side">
      <div class="pills">
        ${g.platinum ? `<span class="pill plat">Platinum</span>` : ""}
        <span class="pill ${g.status}">${STATUS[g.status]}</span>
      </div>
      <span class="date" ${g.dateIsRelease ? `title="Year of release; finish date unknown"` : ""}>${g.dateIsRelease ? "Released " : ""}${fmt(g.lastPlayed)}</span>
    </div>
  </div>`;
}

function render() {
  renderControls();
  const list = data.games.filter(g =>
    (state.platform === "All" || g.platform === state.platform) &&
    (state.status === "all" || g.status === state.status) &&
    g.title.toLowerCase().includes(state.q.toLowerCase()));
  const out = document.getElementById("out");
  if (!list.length) { out.innerHTML = `<div class="empty">Nothing here yet.</div>`; return; }

  if (state.sort === "az") {
    list.sort((a, b) => a.title.localeCompare(b.title));
    out.innerHTML = `<div class="list">${list.map(row).join("")}</div>`;
    return;
  }
  list.sort((a, b) => (b.lastPlayed || "").localeCompare(a.lastPlayed || "") || a.title.localeCompare(b.title));
  const groups = [];
  for (const g of list) {
    const y = g.lastPlayed ? g.lastPlayed.slice(0, 4) : "Undated";
    if (!groups.length || groups.at(-1)[0] !== y) groups.push([y, []]);
    groups.at(-1)[1].push(g);
  }
  out.innerHTML = groups.map(([y, gs]) =>
    `<div class="year" id="y-${y}"><span class="yr">${y}</span><span class="cnt">${gs.length} ${gs.length === 1 ? "game" : "games"}</span></div><div class="list">${gs.map(row).join("")}</div>`).join("");
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.p) state.platform = b.dataset.p;
  if (b.dataset.s) state.status = b.dataset.s;
  render();
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });

fetch("games.json", { cache: "no-cache" }).then(r => r.json()).then(d => {
  data = d;
  document.getElementById("sub").textContent =
    `${d.games.filter(g => g.status === "beaten").length} games played to the credits, across every platform I own.`;
  document.getElementById("foot").innerHTML = `Last updated ${esc(d.updated)}. Sources: ` +
    Object.entries(d.sources).map(([k, v]) => /^https?:/.test(v) ? `<a href="${esc(v)}">${esc(k)}</a>` : `${esc(k)} (${esc(v)})`).join(", ") + ".";
  renderStats();
  renderShelf();
  renderChart();
  render();
  let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(renderChart, 150); });
});
</script>
</body>
</html>
