<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Completed Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --line: #e6e2d9;
    --text: #1d1c1a;
    --muted: #75716a;
    --beaten: #1f7a52;
    --beaten-bg: #e3f2ea;
    --open: #8a6d1d;
    --open-bg: #f6efd9;
    --endless: #5a6170;
    --endless-bg: #eceef2;
    --gold: #a77a12;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 56px 24px 80px; }

  header h1 {
    font-family: Fraunces, Georgia, serif; font-weight: 600;
    font-size: clamp(34px, 5vw, 50px); line-height: 1.05; margin: 0 0 8px; letter-spacing: -0.01em;
  }
  header p { color: var(--muted); margin: 0; }

  .stats { display: flex; gap: 28px; flex-wrap: wrap; margin: 28px 0 32px; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat b { display: block; font: 600 26px Fraunces, Georgia, serif; }
  .stat span { color: var(--muted); font-size: 13px; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
  .group { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .group button {
    border: 0; background: none; color: var(--muted); font: 500 13px Inter, sans-serif;
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .group button.on { background: var(--text); color: #fff; }
  .group button .n { opacity: .6; margin-left: 4px; }
  input[type=search], select {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 9px 16px; font: 14px Inter, sans-serif;
  }
  input[type=search] { flex: 1; min-width: 180px; }

  .year { font: 600 13px Inter, sans-serif; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin: 28px 0 8px; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .row {
    display: grid; grid-template-columns: 104px 1fr auto; gap: 16px; align-items: center;
    padding: 12px 16px; border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .row:hover { background: #fbfaf7; }

  .thumb {
    width: 104px; height: 58px; border-radius: 8px; overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb img.bg { filter: blur(10px) brightness(.85) saturate(1.2); transform: scale(1.4); }
  .thumb img.fg { inset: 4px auto 4px 50%; transform: translateX(-50%); width: auto; height: calc(100% - 8px); aspect-ratio: 1; border-radius: 4px; }
  .thumb .mono { font: 600 20px Fraunces, Georgia, serif; color: rgba(255,255,255,.95); }

  .info { min-width: 0; }
  .title { font-weight: 600; line-height: 1.3; }
  .title .sys { font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 6px; }
  .proof { color: var(--muted); font-size: 13.5px; }
  .note { color: var(--muted); font-size: 13px; font-style: italic; }

  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; white-space: nowrap; }
  .pill { font: 600 11.5px Inter, sans-serif; padding: 3px 9px; border-radius: 999px; }
  .pill.beaten { color: var(--beaten); background: var(--beaten-bg); }
  .pill.unfinished, .pill.unknown { color: var(--open); background: var(--open-bg); }
  .pill.endless { color: var(--endless); background: var(--endless-bg); }
  .pill.plat { color: var(--gold); background: #f8edcf; }
  .date { color: var(--muted); font-size: 12.5px; }
  .pills { display: flex; gap: 6px; }

  .empty { color: var(--muted); padding: 60px 0; text-align: center; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }

  @media (max-width: 600px) {
    .row { grid-template-columns: 72px 1fr; }
    .thumb { width: 72px; height: 44px; }
    .side { grid-column: 2; flex-direction: row; align-items: center; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Games I've finished</h1>
    <p id="sub">Loading…</p>
  </header>

  <section class="stats" id="stats"></section>

  <section class="controls">
    <div class="group" id="platforms"></div>
    <div class="group" id="statuses"></div>
    <input type="search" id="q" placeholder="Search games">
    <select id="sort">
      <option value="recent">Most recent</option>
      <option value="az">A to Z</option>
    </select>
  </section>

  <main id="out"></main>
  <footer id="foot"></footer>
</div>

<script>
const STATUS = { beaten: "Beaten", unfinished: "Unfinished", unknown: "No proof", endless: "No ending" };
const state = { platform: "All", status: "beaten", q: "", sort: "recent" };
let data;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
function initials(t) {
  const w = t.replace(/['’]/g, "").replace(/[^A-Za-z0-9 ]/g, " ").split(/\s+/)
    .filter(x => x && !/^(the|of|a|an|and|in|to)$/i.test(x));
  return ((w[0]?.[0] || "") + (w[1]?.[0] || "")).toUpperCase();
}
function fmt(d) {
  if (!d) return "";
  const [y, m] = d.split("-");
  return new Date(y, m - 1).toLocaleString("en", { month: "short", year: "numeric" });
}
const counts = (list, key) => list.reduce((o, g) => (o[g[key]] = (o[g[key]] || 0) + 1, o), {});

function renderControls() {
  const plats = ["All", ...new Set(data.games.map(g => g.platform))];
  const pc = counts(data.games.filter(g => state.status === "all" || g.status === state.status), "platform");
  document.getElementById("platforms").innerHTML = plats.map(p =>
    `<button data-p="${p}" class="${p === state.platform ? "on" : ""}">${p}${p !== "All" ? `<span class="n">${pc[p] || 0}</span>` : ""}</button>`).join("");
  const sc = counts(data.games.filter(g => state.platform === "All" || g.platform === state.platform), "status");
  const used = Object.keys(STATUS).filter(s => data.games.some(g => g.status === s));
  document.getElementById("statuses").innerHTML = [...used, "all"].map(s =>
    `<button data-s="${s}" class="${s === state.status ? "on" : ""}">${STATUS[s] || "All"}${s !== "all" ? `<span class="n">${sc[s] || 0}</span>` : ""}</button>`).join("");
}

function renderStats() {
  const beaten = data.games.filter(g => g.status === "beaten");
  const year = new Date().getFullYear().toString();
  const tiles = [
    [beaten.length, "games beaten"],
    ...Object.entries(counts(beaten, "platform")).map(([p, n]) => [n, `on ${p}`]),
    [beaten.filter(g => g.platinum).length, "platinums"],
    [beaten.filter(g => g.lastPlayed?.startsWith(year)).length, `finished in ${year}`],
  ];
  document.getElementById("stats").innerHTML = tiles.map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
}

function thumb(g) {
  const h = hue(g.title);
  const bg = `linear-gradient(135deg, hsl(${h} 45% 55%), hsl(${(h + 50) % 360} 50% 38%))`;
  let img = "";
  if (g.cover && g.coverFit === "square")
    img = `<img class="bg" src="${esc(g.cover)}" alt="" loading="lazy" onerror="this.remove()"><img class="fg" src="${esc(g.cover)}" alt="" loading="lazy" onerror="this.remove()">`;
  else if (g.cover)
    img = `<img src="${esc(g.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`;
  return `<div class="thumb" style="background:${bg}"><span class="mono">${esc(initials(g.title))}</span>${img}</div>`;
}

function row(g) {
  return `<div class="row">
    ${thumb(g)}
    <div class="info">
      <div class="title">${esc(g.title)}<span class="sys">${esc(g.system)}</span></div>
      ${g.proof ? `<div class="proof">${esc(g.proof)}</div>` : ""}
      ${g.note ? `<div class="note">${esc(g.note)}</div>` : ""}
    </div>
    <div class="side">
      <div class="pills">
        ${g.platinum ? `<span class="pill plat">Platinum</span>` : ""}
        <span class="pill ${g.status}">${STATUS[g.status]}</span>
      </div>
      <span class="date">${fmt(g.lastPlayed)}</span>
    </div>
  </div>`;
}

function render() {
  renderControls();
  const list = data.games.filter(g =>
    (state.platform === "All" || g.platform === state.platform) &&
    (state.status === "all" || g.status === state.status) &&
    g.title.toLowerCase().includes(state.q.toLowerCase()));
  const out = document.getElementById("out");
  if (!list.length) { out.innerHTML = `<div class="empty">Nothing here yet.</div>`; return; }

  if (state.sort === "az") {
    list.sort((a, b) => a.title.localeCompare(b.title));
    out.innerHTML = `<div class="list">${list.map(row).join("")}</div>`;
    return;
  }
  list.sort((a, b) => (b.lastPlayed || "").localeCompare(a.lastPlayed || "") || a.title.localeCompare(b.title));
  const groups = [];
  for (const g of list) {
    const y = g.lastPlayed ? g.lastPlayed.slice(0, 4) : "Undated";
    if (!groups.length || groups.at(-1)[0] !== y) groups.push([y, []]);
    groups.at(-1)[1].push(g);
  }
  out.innerHTML = groups.map(([y, gs]) =>
    `<div class="year">${y} · ${gs.length}</div><div class="list">${gs.map(row).join("")}</div>`).join("");
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.p) state.platform = b.dataset.p;
  if (b.dataset.s) state.status = b.dataset.s;
  render();
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });

fetch("games.json", { cache: "no-cache" }).then(r => r.json()).then(d => {
  data = d;
  document.getElementById("sub").textContent =
    `${d.games.filter(g => g.status === "beaten").length} games played to the credits, across every platform I own.`;
  document.getElementById("foot").innerHTML = `Last updated ${esc(d.updated)}. Sources: ` +
    Object.entries(d.sources).map(([k, v]) => `<a href="${esc(v)}">${esc(k)}</a>`).join(", ") + ".";
  renderStats();
  render();
});
</script>
</body>
</html>
